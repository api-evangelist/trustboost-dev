  detail:
  - field: protocolVersion
    observed: absent
    note: The one hard failure. Without it a client cannot tell which A2A revision the card targets; the card's own "schema_version":"v1" is not an A2A field.
  - field: capabilities
    observed: object of ten booleans (pii_detection, pii_redaction, context_aware_sanitization, proof_of_sanitization_on_chain, privacy_budget_per_agent, m2m_trust_score, mcp_server, multilingual_8_languages, x402_compatible, fail_closed)
    note: >-
      Passes the object check, but none of the keys is an A2A capability (streaming, pushNotifications,
      stateTransitionHistory, extensions). They are product feature flags. An A2A client reading
      capabilities.streaming will find nothing.
  - field: skills
    observed: array of 3, each with id, name, description, tags, examples (on one), inputModes, outputModes
    note: Genuinely A2A-shaped skill objects; this is the most conformant part of the card.
  - field: defaultInputModes / defaultOutputModes
    observed: "['text/plain', 'application/json'] / ['application/json']"
    note: Present and well-formed.
  - field: url
    observed: https://api.trustboost.dev
    note: >-
      The API root, not an A2A JSON-RPC endpoint. The provider's README and llms.txt name POST /message/send
      as the A2A endpoint. Probed 2026-09-19: a JSON-RPC 2.0 body ({"jsonrpc":"2.0","method":"tasks/get",...})
      returned HTTP 422 {"detail":[{"type":"missing","loc":["body","message"],"msg":"Field required"}]} — a
      FastAPI handler expecting a top-level "message" field — and GET returned 405. That is a REST route named
      after the A2A method, not an A2A JSONRPC transport, so the README's "A2A ✅ Conformant" claim does not
      hold against the A2A 0.3.0/1.0.0 shape.
  - field: extensions
    observed: top-level object naming ap2 (v0.1, x402 settlement on Base/Solana), bedrock_agentcore and apify_complement
    note: >-
      A2A puts extensions under capabilities.extensions[] as {uri, required, description}. Here they are a
      free-form top-level object; the ap2 entry does point at the real AP2 v0.1 repository, which is the card's
      agent-commerce signal — see conformance/trustboost-dev-conformance.yml.
  - field: payment
    observed: prepaid model, protocols [solana-usdc, x402], tiers {trial 50/wallet free, paid 149 USDC per 10,000, preview 3/ip/hour}, nanopayments 0.0149 USDC per call
    note: >-
      Non-standard but substantive. Note the per-call price here (0.0149) differs from the live /pricing
