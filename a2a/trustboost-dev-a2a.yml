surface_relationship:
  note: >-
    One host, three agent doors onto one function. A2A: the card advertises three skills, of which only
    sanitize_pii has a working write path (POST /message/send, non-JSON-RPC); verify_proof and
    trustboost_score correspond to GET /verify/{anchor_tx} and GET /score/{wallet_address} in the REST
    contract. MCP: one tool, sanitize_pii, at https://api.trustboost.dev/mcp. REST: 9 operations. All three
    settle through the same x402 / tx_hash gate. The sibling ANP document at
    /.well-known/agent-description.json (did:web:api.trustboost.dev) describes the same agent in the
    Agent Network Protocol vocabulary and is saved under well-known/. See mcp/trustboost-dev-tool-crosswalk.yml.
