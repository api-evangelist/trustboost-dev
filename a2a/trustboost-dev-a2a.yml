discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: api.trustboost.dev
  note: >-
    Served from api.trustboost.dev, the only host this provider operates — it is the OpenAPI servers[] host,
    the MCP host, the "A2A" host and the canonical website (the HTML root declares rel=canonical
    https://api.trustboost.dev). The apex trustboost.dev and www.trustboost.dev have no DNS A record at all
    (curl exit 6 on every path), so nothing can be served there. The legacy /.well-known/agent.json returns a
    real JSON 404 ({"detail":"Not Found"}, 22 bytes, FastAPI's default), and a negative-control path
    (/.well-known/trustboost-negative-control-7f3a91.json) also 404s, so the 200 on agent-card.json is a served
    document and not an SPA catch-all. Ownership is not in question: the card's url is
    https://api.trustboost.dev, its repository is github.com/teodorofodocrispin-cmyk/TrustBoost-PII-Sanitizer,
    the OpenAPI on the same host titles itself "TrustBoost PII Sanitizer" with the same MIT license URL, and
    the root page's JSON-LD names the same author and email.
