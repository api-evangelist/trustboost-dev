  headline: >-
    No authentication of any kind. The OpenAPI declares no securitySchemes and no components; the MCP server
    card says auth {type: none}; the agent card's integration block says authentication "none"; SKILL.md says
    "No authentication required" and "requires_env: none"; the ai-plugin.json says auth type none. There is no
    signup, no account, no API key, no bearer token, no OAuth and no OIDC — /.well-known/openid-configuration,
    /oauth-authorization-server and /oauth-protected-resource all 404. What stands in for authentication is
    PAYMENT EVIDENCE carried in the request, which meters access without identifying the caller.
    derive-authentication.py correctly produced no profile from the contract; this file records the access
    model the provider documents instead.
