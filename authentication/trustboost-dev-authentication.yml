identity_note: >-
  Because nothing authenticates the caller, wallet_address is self-asserted. The TrustBoost Score
  (GET /score/{wallet_address}) therefore rates a string's usage history, and any caller can read any
  wallet's score. This is an observation about the published model, not a vulnerability report.
