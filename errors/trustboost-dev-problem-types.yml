problem_types:
- status: 402
  title: Payment required / TRIAL quota exhausted
  code: QUOTA_EXHAUSTED_OR_PAYMENT_REQUIRED
  occurrences: 2
  source_operations: [sanitize_pii, sanitize_discovery]
  causes:
  - No tx_hash and no PAYMENT-SIGNATURE / X-PAYMENT header on a paid route (x402 challenge).
  - tx_hash=TRIAL after the wallet_address has used its 50 free sanitizations (SKILL.md envelope with trial_info and payment_info).
  remediation: >-
    Decode the PAYMENT-REQUIRED header, sign a USDC transfer authorization for one of accepts[] and retry with
    PAYMENT-SIGNATURE (X-PAYMENT legacy also accepted); or send 149 USDC on Solana and retry with the
    resulting tx_hash. Call GET /preflight first — it returns allow/caution/block and the exact price.
- status: 413
  title: Text too long — split into chunks
  occurrences: 1
  source_operations: [sanitize_pii]
  causes:
  - 'text exceeds 10,000 characters (contract: "Max 10,000 chars."); the free preview caps at 500.'
  remediation: Chunk the input and sanitize each chunk; each chunk consumes one call.
- status: 409
  title: Transaction hash already used
  code: TX_HASH_ALREADY_USED
  occurrences: 0
  source_operations: [sanitize_pii]
  causes:
  - A Solana bundle tx_hash was submitted a second time; "Each tx_hash can only be used once."
  remediation: Each payment yields one 10,000-call bundle bound to the tx_hash; reuse is rejected. Not declared in the OpenAPI — documented in SKILL.md only.
  source: SKILL.md "API Response (Error 409)"
- status: 404
  title: No sanitization record for this transaction
  occurrences: 1
  source_operations: [verify_proof]
  causes:
  - Unknown anchor_tx, or a TRIAL sanitization — "Only paid sanitizations are anchored on Solana."
  remediation: Verify only the proof_of_sanitization.solana_tx returned by a paid /sanitize response.
- status: 405
  title: Method not allowed
  occurrences: 0
  source_operations: [a2a_message_send, sanitize_preview (via /demo)]
  causes:
  - GET on a POST-only route.
- status: 422
  title: Request validation failed
  occurrences: 0
  source_operations: [a2a_message_send, sanitize_pii, sanitize_preview]
  causes:
  - 'Missing required body field (observed: message on /message/send); FastAPI/pydantic validation.'
  remediation: Read detail[].loc for the failing field path.
- status: 200
  title: MCP JSON-RPC error on HTTP 200
  occurrences: 0
  source_operations: [mcp_execute]
  causes:
  - '-32601 Method not found for resources/list, prompts/list or any method other than initialize, tools/list, tools/call.'
  remediation: Inspect result vs error in the JSON-RPC body; the HTTP status does not signal the failure.
