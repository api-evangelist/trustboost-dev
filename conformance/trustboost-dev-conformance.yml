summary: >-
  TrustBoost's conformance profile is the agent-commerce protocol stack: x402 v2 observed live and definitively
  (a real HTTP 402 with a base64 PAYMENT-REQUIRED header decoding to a v2 PaymentRequirements object, plus a
  /.well-known/x402 discovery document), an MCP server at protocol version 2024-11-05 with a non-standard
  schema key, an A2A card that fails the protocolVersion hard check and an "A2A endpoint" that is not
  JSON-RPC, an ANP agent-description with a did:web identifier, and CAIP-2 chain identifiers for Base and
  Solana. It declares no OAuth/OIDC, no RFC 9457 problem details, no RFC 9116 security.txt, no RFC 9727 API
  catalog and no RFC 8594 sunset signalling. Its privacy-regime statements (GDPR Art. 28 processor role, EU AI
  Act Art. 12/13/26, LGPD, APPI, CCPA) are self-declarations in a privacy policy that also calls the service a
  learning prototype with no certified audit; they are recorded as claims, not conformance.
standards:
- id: x402
  name: x402 HTTP payment protocol
  version: '2'
  conforms: true
  verification: observed
  domain_standard_signature: true
  evidence: >-
    GET https://api.trustboost.dev/sanitize returned HTTP 402 with a PAYMENT-REQUIRED header whose base64 body
    decodes to {"x402Version":2,"resource":{"url":"https://api.trustboost.dev/sanitize",...},"accepts":[{"scheme":"exact","network":"eip155:8453","amount":"10000","payTo":"0xCf1d...37E7","asset":"0x8335...2913"},{"scheme":"exact","network":"solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp","amount":"10000","payTo":"giu4...NWE4","asset":"EPjF...Dt1v"}]}
    with the same object in the JSON body plus a bazaar extension; GET /.well-known/x402 (and /.well-known/x402.json)
    serves a v2 discovery document for the 149 USDC bundle (well-known/trustboost-dev-x402.json). The OpenAPI
    declares 402 on sanitize_pii and a dedicated sanitize_discovery operation "for x402 validators".
  note: The contract-level signature for agent commerce in this market. Also cross-listed on x402-list.com (200).
- id: caip-2
  name: CAIP-2 chain identifiers
  conforms: true
  evidence: eip155:8453 (Base) and solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp (Solana mainnet) in the live PaymentRequirements accepts[].network.
- id: mcp
  name: Model Context Protocol
  version: '2024-11-05'
  conforms: true
  verification: observed
  evidence: 'POST https://api.trustboost.dev/mcp initialize returned protocolVersion "2024-11-05", serverInfo {trustboost, 2.6.0}, capabilities {tools: {}}; tools/list returned 1 tool. See mcp/trustboost-dev-mcp.yml.'
  deviations:
  - tools/list publishes the schema under input_schema, not the specified inputSchema
  - GET /mcp returns a 200 JSON manifest rather than an SSE stream (2024-11-05 HTTP+SSE) or a 405/Streamable HTTP response
- id: json-rpc-2.0
  conforms: true
  evidence: '/mcp answers {"jsonrpc":"2.0",...} with standard -32601 for unimplemented methods. /message/send does NOT — it is a FastAPI route requiring body.message (422 on a JSON-RPC envelope).'
  scope: MCP endpoint only
- id: a2a
  name: Agent2Agent protocol
  version: null
  conforms: false
  grade: flavored
  evidence: >-
    a2a/trustboost-dev-agent-card.json — capabilities is an object and skills an array of 3, but protocolVersion
