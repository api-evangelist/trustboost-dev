  - {regime: EU AI Act (Regulation EU 2024/1689), claim: 'Articles 12, 13, 26 audit-trail support via Proof of Sanitization', source: 'pricing.md, llms.txt, agent card compliance[]'}
  - {regime: LGPD, claim: 'Article 46', source: llms-full.txt}
