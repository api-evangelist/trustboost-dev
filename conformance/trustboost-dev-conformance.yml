claims:
  note: >-
    Self-declared regulatory posture, quoted from the provider's own surfaces. None is a certification and the
    provider says so: PRIVACY.md §7 "This is a learning prototype, not a certified privacy tool"; SKILL.md
    "Independent security audit: pending — this project has not been audited by a certified security firm".
    No trust center, no SOC 2 / ISO 27001 / HIPAA attestation, so no Compliance pointer is emitted.
  entries:
