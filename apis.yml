apis:
- aid: trustboost-dev:trustboost-mcp-server
  name: TrustBoost MCP Server
  description: >-
    Remote Model Context Protocol server at https://api.trustboost.dev/mcp (HTTP JSON-RPC 2.0, protocol
    version 2024-11-05, serverInfo trustboost 2.6.0). initialize and tools/list answer anonymously with
    one tool, sanitize_pii, whose schema is published under the non-standard key input_schema rather than
    the MCP inputSchema; resources/list and prompts/list return -32601. Paid use is gated by x402 (HTTP
    402) or a tx_hash, not by authentication. A server card is served at /.well-known/mcp-server-card.json
    (with /.well-known/mcp.json 301ing to it), and the server is listed on Glama.
  humanURL: https://api.trustboost.dev/
  baseURL: https://api.trustboost.dev/mcp
  tags:
  - MCP
  - Agent-Native
  - Privacy
  tags_raw:
  - MCP
  - agent-native
  - Privacy
  properties:
  - type: MCPServer
    url: mcp/trustboost-dev-mcp.yml
  - type: MCPServer
    name: TrustBoost MCP endpoint (HTTP JSON-RPC)
    url: https://api.trustboost.dev/mcp
  - type: ToolCrosswalk
    url: mcp/trustboost-dev-tool-crosswalk.yml
- aid: trustboost-dev:trustboost-a2a-agent
  name: TrustBoost A2A Agent
  description: >-
    Agent2Agent surface: an agent card served from https://api.trustboost.dev/.well-known/agent-card.json
    (version 2.6.0, no protocolVersion, capabilities object of product flags, three skills — sanitize_pii,
    verify_proof, trustboost_score) and a POST /message/send route the provider calls its A2A endpoint.
    The route is a plain FastAPI handler that requires a top-level "message" body field and rejects a
    JSON-RPC 2.0 envelope with 422, so the transport is not A2A JSONRPC; the card is graded flavored in
    a2a/trustboost-dev-a2a.yml. An ANP agent-description document (did:web:api.trustboost.dev) is served
    alongside it.
  humanURL: https://api.trustboost.dev/
  baseURL: https://api.trustboost.dev/message/send
  tags:
  - A2A
  - Agent-Native
  - x402
  tags_raw:
  - A2A
  - agent-native
  - x402
  properties:
  - type: AgentCard
    url: a2a/trustboost-dev-a2a.yml
  - type: AgentCard
    name: A2A Agent Card (provider-hosted)
    url: https://api.trustboost.dev/.well-known/agent-card.json
