aid: trustboost-dev
name: TrustBoost PII Sanitizer
description: >-
  TrustBoost PII Sanitizer is a pay-per-call "privacy firewall" for autonomous AI agent pipelines, built and
  operated by an individual developer (Teodoro Crispin, GitHub teodorofodocrispin-cmyk) and served entirely
  from https://api.trustboost.dev — the apex trustboost.dev has no DNS record. An agent POSTs text to
  /sanitize and gets it back with emails, phone numbers, national IDs (RFC, CUIT, CPF, CNPJ, Personalausweis,
  マイナンバー, NIR, Codice Fiscale, RRN and more across 8 languages), API keys and financial data replaced by
  [REDACTED], plus a safety_score, a risk_category and an entity list; five context modes (general, legal,
  financial, medical, code) tune the redaction. There is no account and no API key: 50 free calls per wallet
  with tx_hash=TRIAL, a free 3-per-hour preview, then x402 payment in USDC on Base or Solana ($0.01 per call or
  a 149 USDC prepaid bundle of 10,000), with every paid sanitization anchored on Solana as a verifiable "Proof
  of Sanitization". The same service is exposed three ways from one host: a 9-operation OpenAPI 3.0.0 REST
  contract, a remote MCP server at /mcp (one tool, sanitize_pii), and an A2A-flavored agent card at
  /.well-known/agent-card.json with three skills. The provider's own privacy policy describes it as a learning
  prototype that sends raw text to OpenAI GPT-4o-mini for detection and has no certified security audit.
