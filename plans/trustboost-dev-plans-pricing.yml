  Four access tiers read from the machine-readable GET /pricing (JSON, 200) and cross-checked against
  pricing.md, /preflight and the agent card. Two free tiers (a wallet-free preview and a 50-call TRIAL per
  wallet), a $0.01 USDC pay-per-call rail via x402 on Base (preferred) or Solana, and a 149 USDC prepaid bundle
  of 10,000 calls on Solana (about $0.0149 per call) that is the only tier producing an on-chain Proof of
  Sanitization. The surfaces disagree on the per-call price: /pricing and llms.txt say $0.01 via
  /sanitize/quick; the agent card's nanopayments block says 0.0149 USDC per call; pricing.md and /preflight
  describe only the bundle (0.0149 per call) and do not mention pay-per-call at all. The live x402 challenge
  observed on GET /sanitize asks amount "10000" in 6-decimal USDC, i.e. $0.01, so the JSON pricing document
  matches the wire.
