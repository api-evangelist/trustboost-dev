summary: >-
  There is no separate test environment and no test key: production is the sandbox. The rehearsal surface is
  three free tiers of the live endpoint — a wallet-free preview (POST /sanitize/preview, 3 per IP per hour,
  500 characters, zero retention per SKILL.md), a per-wallet TRIAL of 50 sanitizations (tx_hash="TRIAL" with
  any string as wallet_address), and free read endpoints (/preflight, /policy, /score, /budget, /health,
  /verify) — plus a pre-payment /preflight check that returns allow/caution/block and the exact price before
  an agent authorizes wallet spend. No sanitization request was sent by this pipeline; the values below are
  the provider's published examples, copied verbatim.
test_vs_live:
  separate_environment: false
  key_prefixes: not applicable — no API keys exist
  note: One host, one contract. The TRIAL tier is the provider's designated test mode; SKILL.md says "Always use TRIAL (50 free requests per wallet) before any paid transaction."
free_tiers:
- name: Preview
  operation: sanitize_preview
  route: POST /sanitize/preview (aliases POST /demo, POST /detect)
  cost: free
  quota: 3 requests per IP per hour
  limits: [500 characters per request]
  wallet_required: false
  retention: '"Use /sanitize/preview for a zero-retention free test" (SKILL.md data-handling notice)'
  response_extras: [demo true, requests_remaining, next]
- name: Trial
  operation: sanitize_pii
  route: POST /sanitize (alias POST /redact)
  cost: free
  quota: 50 sanitizations per wallet_address
  how: tx_hash "TRIAL"
  wallet_required: 'any string as wallet_address ("your-agent-id"); a public Solana address is optional'
  note: 'SKILL.md Known Limitations: "TRIAL is trust-based: Per-wallet quota tracking is not cryptographically verified."'
- name: Free reads
  operations: [get_trustboost_score, get_budget_status, verify_proof, health_check]
  routes: [GET /preflight, GET /policy]
  cost: free
preflight:
  route: GET /preflight
  purpose: pre-payment authorization check for buyer agents
  observed: '{"preflight":"allow","status":"operational","payment":{"amount":149,"currency":"USDC","network":"solana-mainnet","unit":"10000 sanitizations","price_per_call":0.0149,"trial_available":true,"trial_quota":50,"trial_key":"TRIAL"},"policy_hash_url":"https://api.trustboost.dev/policy","dispute_path":"teodorofodocrispin@gmail.com","revocation":"Unused quota non-refundable. Contact dispute_path within 48h of payment for issues.","data_handling":{"raw_input_stored":false,"sanitized_output_retained_days":90,"pii_logged":false}}'
