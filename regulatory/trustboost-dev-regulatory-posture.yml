summary: >-
  Harvested only. TrustBoost's regulatory surface is one document — PRIVACY.md v4.0 in the GitHub repository
  (effective May 17, 2026, "Last updated: May 22, 2026"), which /policy names as terms_url — plus the machine
  endpoints /preflight and /policy and the robots.txt Content-Signal. Four signals carry substance: a named,
  located sub-processor table; a data-subject request channel with a stated 30-day response; a stated
  processing and storage location (Render, AWS us-east-1); and an AI-processing disclosure that says raw text
  is sent to OpenAI GPT-4o-mini. Nothing else on the list is published, and every conventional path probed on
  the host 404s. The policy contradicts itself on retention (§5 "retained indefinitely" versus the later
  processing table "90 days"), and that contradiction is recorded rather than resolved.
